[project]
name = "btc-risk-agent"
version = "0.1.0"
description = "Multi-agent RAG system for Bitcoin wallet risk triage using public data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "langgraph",
    "langchain",
    "langfuse",
    "ragas",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: slow evals that call an LLM or the network (deselect with -m 'not eval')"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
